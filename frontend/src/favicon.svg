<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- B10: a generic mark - three linked machines on the console's own colours. No brand imitation. -->
  <rect width="32" height="32" rx="7" fill="#0b0f14"/>
  <g stroke="#ff6500" stroke-width="2.5" stroke-linecap="round">
    <line x1="10" y1="22" x2="16" y2="10"/>
    <line x1="16" y1="10" x2="22" y2="22"/>
    <line x1="10" y1="22" x2="22" y2="22"/>
  </g>
  <g fill="#ff6500">
    <circle cx="16" cy="10" r="3.5"/>
    <circle cx="10" cy="22" r="3.5"/>
    <circle cx="22" cy="22" r="3.5"/>
  </g>
</svg>
